services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      # Bind mount: source code from host is live inside the container
      - .:/app
      # Named volumes override the bind mount subdirs with Linux-compatible artifacts.
      # Docker resolves overlapping mounts correctly: named volume wins for its path.
      - backend-target:/app/backend/target
      - frontend-node-modules:/app/frontend/node_modules
      - cargo-registry:/usr/local/cargo/registry
    environment:
      # Signal used by the justfile to detect it is running inside the container
      IN_CONTAINER: "1"
      DATABASE_URL: ${DATABASE_URL:-postgres://allowance:allowance@postgres:5432/allowance}
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:3000}
      RUST_LOG: ${RUST_LOG:-info}
      # VITE_ prefix is required for Vite to expose this to browser code.
      # Value uses localhost because the browser hits the host-forwarded port.
      VITE_ALLOWANCE_API_URL: ${VITE_ALLOWANCE_API_URL:-http://localhost:3000}
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/app
      # Separate target dir from `dev` (see CARGO_TARGET_DIR below): cargo
      # serializes writes to a target directory, so sharing one with `dev`
      # would make host-triggered `just build`/`just test` block silently
      # while cargo watch here is mid-recompile.
      # Must stay listed in .gitignore under its own name (target-bg) —
      # cargo watch treats any untracked path as source, so an unignored
      # target dir makes it see its own build output as a change and
      # restart mid-compile forever.
      - backend-target-bg:/app/backend/target-bg
      - cargo-registry:/usr/local/cargo/registry
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://allowance:allowance@postgres:5432/allowance}
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:3000}
      RUST_LOG: ${RUST_LOG:-info}
      CARGO_TARGET_DIR: /app/backend/target-bg
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    command: bash -c "cd /app/backend && cargo watch --poll -x run"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/app
      - frontend-node-modules:/app/frontend/node_modules
    environment:
      # VITE_ prefix is required for Vite to expose this to browser code.
      # Value uses localhost because the browser hits the host-forwarded port.
      VITE_ALLOWANCE_API_URL: ${VITE_ALLOWANCE_API_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    # npm ci (not install): fails on a stale lockfile instead of rewriting it,
    # since this runs unattended on every start and restart.
    command: bash -c "cd /app/frontend && npm ci && npm run dev -- --host"
    restart: unless-stopped
    working_dir: /app

  postgres:
    image: postgres:17
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allowance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allowance}
      POSTGRES_DB: ${POSTGRES_DB:-allowance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allowance} -d ${POSTGRES_DB:-allowance}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend-target:
  backend-target-bg:
  frontend-node-modules:
  postgres-data:
  cargo-registry:
